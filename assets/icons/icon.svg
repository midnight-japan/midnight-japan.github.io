<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fest" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff2f70"/><stop offset=".55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#ffb836"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17151c"/><stop offset="1" stop-color="#08080b"/></linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#16161b"/></linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="sun"><circle cx="336" cy="236" r="132"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- rising sun -->
    <circle cx="336" cy="236" r="132" fill="url(#fest)"/>
    <g fill="#08080b" clip-path="url(#sun)"><rect x="190" y="248" width="300" height="10"/><rect x="190" y="276" width="300" height="14"/><rect x="190" y="308" width="300" height="18"/></g>
    <!-- horizon -->
    <rect x="0" y="330" width="512" height="182" fill="#0b0b0e"/>
    <!-- the expressway sweeping in from the bottom left -->
    <path d="M-40 512 C 120 470, 220 400, 300 334 L 336 334 C 290 400, 230 470, 150 512 Z" fill="url(#road)"/>
    <path d="M-40 512 C 120 470, 220 400, 300 334" fill="none" stroke="#f4f2ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M150 512 C 230 470, 290 400, 336 334" fill="none" stroke="#f4f2ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M55 512 C 175 470, 262 400, 318 334" fill="none" stroke="url(#fest)" stroke-width="7" stroke-dasharray="26 22" stroke-linecap="round"/>
  </g>
</svg>
